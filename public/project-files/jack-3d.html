  <!-- Import map for ES modules -->
  <script type="importmap">
  {
    "imports": {

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useEffect, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";
    import { motion, useScroll, useTransform } from "framer-motion";
    import { ArrowUpRight } from "lucide-react";

    /* ============ FadeIn ============ */
    const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, as = "div", className = "" }) => {
      const Component = motion(as);
      return (
        <Component
          whileInView
          viewport={{ once: true, margin: "50px", amount: 0 }}
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
        >
          {children}
        </Component>
      );
    };

    /* ============ Magnet ============ */
    const Magnet = ({ children, padding = 150, strength = 3, activeTransition = "transform 0.3s ease-out", inactiveTransition = "transform 0.6s ease-in-out", className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!ref.current) return;
          const rect = ref.current.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const distX = e.clientX - cx;
          const distY = e.clientY - cy;
          const distance = Math.sqrt(distX * distX + distY * distY);
          const threshold = Math.max(rect.width, rect.height) / 2 + padding;

          if (distance < threshold) {
            ref.current.style.transition = activeTransition;
            ref.current.style.transform = `translate3d(${distX / strength}px, ${distY / strength}px, 0)`;
          } else {
            ref.current.style.transition = inactiveTransition;
            ref.current.style.transform = `translate3d(0,0,0)`;
          }
        };
        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, [padding, strength, activeTransition, inactiveTransition]);

      return <div ref={ref} className={className} style={{ willChange: "transform" }}>{children}</div>;
    };

    /* ============ ContactButton ============ */
    const ContactButton = ({ label = "Contact Me", className = "" }) => (
      <button
        className={`relative rounded-full text-white font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base outline outline-2 outline-white -outline-offset-[3px] ${className}`}
        style={{
          background: "linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)",
          boxShadow: "inset 4px 4px 12px #7721B1, 0px 4px 4px rgba(181, 1, 167, 0.25)",
        }}
      >
        {label}
      </button>
    );

    /* ============ LiveProjectButton ============ */
    const LiveProjectButton = () => (
      <button className="flex items-center gap-2 rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base hover:bg-[#D7E2EA]/10 transition-colors">
        Live Project <ArrowUpRight className="w-4 h-4" />
      </button>
    );

    /* ============ AnimatedText ============ */
    const AnimatedText = ({ text, className }) => {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ["start 0.8", "end 0.2"] });
      return (
        <p ref={ref} className={className}>
          {text.split("").map((char, i) => (
            <span key={i} className="relative inline-block">
              <span className="invisible">{char === " " ? "\u00A0" : char}</span>
              <CharSpan char={char} index={i} total={text.length} progress={scrollYProgress} />
            </span>
          ))}
        </p>
      );
    };

    const CharSpan = ({ char, index, total, progress }) => {
      const opacity = useTransform(progress, [index / total, (index + 1) / total], [0.2, 1]);
      return (
        <motion.span className="absolute inset-0" style={{ opacity }}>
          {char === " " ? "\u00A0" : char}
        </motion.span>
      );
    };

    /* ============ HERO SECTION ============ */
    const HeroSection = () => (
      <section className="h-screen w-full flex flex-col overflow-x-clip relative">
        <FadeIn delay={0} y={-20}>
          <nav className="flex justify-between items-center w-full px-6 md:px-10 pt-6 md:pt-8">
            {["About", "Price", "Projects", "Contact"].map((l) => (
              <a key={l} href={`#${l.toLowerCase()}`} className="text-[#D7E2EA] font-medium uppercase tracking-wider text-sm md:text-lg lg:text-[1.4rem] transition-opacity duration-200 hover:opacity-70">
                {l}
              </a>
            ))}
          </nav>
        </FadeIn>

        <div className="overflow-hidden w-full flex-1 flex items-center justify-center">
          <FadeIn delay={0.15} y={40} className="w-full">
            <h1 className="hero-heading font-black uppercase tracking-tight leading-none whitespace-nowrap w-full text-center text-[14vw] sm:text-[15vw] md:text-[16vw] lg:text-[17.5vw] mt-6 sm:mt-4 md:-mt-5">
              Hi, i'm jack
            </h1>
          </FadeIn>
        </div>

        <FadeIn delay={0.6} y={30} className="absolute left-1/2 -translate-x-1/2 z-10 top-1/2 -translate-y-1/2 sm:top-auto sm:translate-y-0 sm:bottom-0">
          <Magnet padding={150} strength={3}>
            <img src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png" alt="Jack" className="w-[280px] sm:w-[360px] md:w-[440px] lg:w-[520px] h-auto object-contain pointer-events-none" />
          </Magnet>
        </FadeIn>

        <div className="flex justify-between items-end pb-7 sm:pb-8 md:pb-10 px-6 md:px-10">
          <FadeIn delay={0.35} y={20}>
            <p className="text-[#D7E2EA] font-light uppercase tracking-wide leading-snug max-w-[160px] sm:max-w-[220px] md:max-w-[260px]" style={{ fontSize: "clamp(0.75rem, 1.4vw, 1.5rem)" }}>
              a 3d creator driven by crafting striking and unforgettable projects
            </p>
          </FadeIn>
          <FadeIn delay={0.5} y={20}>
            <ContactButton />
          </FadeIn>
        </div>
      </section>
    );

    /* ============ MARQUEE SECTION ============ */
    const GIFS = [
      "https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif",
      "https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif",
      "https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif",
      "https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif",
      "https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif",
      "https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif",
      "https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif",
      "https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif",
      "https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif",
      "https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif",
      "https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif",
      "https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif",
      "https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif",
      "https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif",
      "https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif",
      "https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif",
      "https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif",
      "https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif",
      "https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif",
      "https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif",
      "https://motionsites.ai/assets/hero-celestia-preview-0yO3jXO8.gif",
    ];

    const MarqueeSection = () => {
      const sectionRef = useRef(null);
      const row1Ref = useRef(null);
      const row2Ref = useRef(null);
      const row1 = GIFS.slice(0, 11);
      const row2 = GIFS.slice(11);

      useEffect(() => {
        const handler = () => {
          if (!sectionRef.current) return;
          const top = sectionRef.current.getBoundingClientRect().top + window.scrollY;
          const offset = (window.scrollY - top + window.innerHeight) * 0.3;
          if (row1Ref.current) row1Ref.current.style.transform = `translateX(${offset - 200}px)`;
          if (row2Ref.current) row2Ref.current.style.transform = `translateX(${-(offset - 200)}px)`;
        };
        window.addEventListener("scroll", handler, { passive: true });
        handler();
        return () => window.removeEventListener("scroll", handler);
      }, []);

      const renderRow = (items, keyPrefix) => [...items, ...items, ...items].map((src, i) => (
        <img key={`${keyPrefix}-${i}`} src={src} loading="lazy" alt="" className="w-[420px] h-[270px] rounded-2xl object-cover flex-shrink-0" />
      ));

      return (
        <section ref={sectionRef} className="bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden flex flex-col gap-3">
          <div ref={row1Ref} className="flex gap-3" style={{ willChange: "transform" }}>{renderRow(row1, "r1")}</div>
          <div ref={row2Ref} className="flex gap-3" style={{ willChange: "transform" }}>{renderRow(row2, "r2")}</div>
        </section>
      );
    };

    /* ============ ABOUT SECTION ============ */
    const ABOUT_DECORATIONS = [
      { src: "https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png", className: "top-[4%] left-[1%] sm:left-[2%] md:left-[4%] w-[120px] sm:w-[160px] md:w-[210px]", delay: 0.1, x: -80 },
      { src: "https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png", className: "top-[4%] right-[1%] sm:right-[2%] md:right-[4%] w-[120px] sm:w-[160px] md:w-[210px]", delay: 0.15, x: 80 },
      { src: "https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png", className: "bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] w-[100px] sm:w-[140px] md:w-[180px]", delay: 0.25, x: -80 },
      { src: "https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png", className: "bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] w-[130px] sm:w-[170px] md:w-[220px]", delay: 0.3, x: 80 },
    ];

    const AboutSection = () => (
      <section id="about" className="min-h-screen px-5 sm:px-8 md:px-10 py-20 flex flex-col items-center justify-center gap-10 sm:gap-14 md:gap-16 relative">
        {ABOUT_DECORATIONS.map((d, i) => (
          <FadeIn key={i} delay={d.delay} x={d.x} y={0} duration={0.9} className={`absolute ${d.className}`}>
            <img src={d.src} alt="" className="w-full h-auto object-contain" />
          </FadeIn>
        ))}
        <FadeIn y={40}>
          <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center" style={{ fontSize: "clamp(3rem, 12vw, 160px)" }}>About me</h2>
        </FadeIn>
        <div className="flex flex-col items-center gap-16 sm:gap-20 md:gap-24">
          <AnimatedText text="With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!" className="text-[#D7E2EA] font-medium text-center leading-relaxed max-w-[560px]" />
          <FadeIn delay={0.3} y={20}><ContactButton /></FadeIn>
        </div>
      </section>
    );

    /* ============ SERVICES SECTION ============ */
    const SERVICES = [
      { num: "01", name: "3D Modeling", desc: "Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations." },
      { num: "02", name: "Rendering", desc: "High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life." },
      { num: "03", name: "Motion Design", desc: "Dynamic animations and motion graphics that add energy and storytelling to brands, products, and digital experiences." },
      { num: "04", name: "Branding", desc: "Crafting cohesive visual identities -- from logos to full brand systems -- that communicate a clear and memorable presence." },
      { num: "05", name: "Web Design", desc: "Designing clean, modern, and conversion-focused websites with attention to layout, typography, and user experience." },
    ];

    const ServicesSection = () => (
      <section className="bg-white rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32">
        <FadeIn y={40}>
          <h2 className="text-[#0C0C0C] font-black uppercase text-center" style={{ fontSize: "clamp(3rem, 12vw, 160px)", marginBottom: "clamp(4rem, 6vw, 7rem)" }}>Services</h2>
        </FadeIn>
        <div className="max-w-5xl mx-auto">
          {SERVICES.map((s, i) => (
            <FadeIn key={s.num} delay={i * 0.1} y={20} className="flex items-start gap-4 sm:gap-6 md:gap-10 py-8 sm:py-10 md:py-12 border-t border-[rgba(12,12,12,0.15)]">
              <div className="font-black text-[#0C0C0C] leading-none flex-shrink-0" style={{ fontSize: "clamp(3rem, 10vw, 140px)" }}>{s.num}</div>
              <div className="flex flex-col gap-2 sm:gap-3 pt-4 sm:pt-6 md:pt-8">
                <h3 className="font-medium uppercase text-[#0C0C0C]" style={{ fontSize: "clamp(1rem, 2.2vw, 2.1rem)" }}>{s.name}</h3>
                <p className="font-light text-[#0C0C0C] leading-relaxed max-w-2xl opacity-60" style={{ fontSize: "clamp(0.85rem, 1.6vw, 1.25rem)" }}>{s.desc}</p>
              </div>
            </FadeIn>
          ))}
        </div>
      </section>
    );

    /* ============ PROJECTS SECTION ============ */
    const PROJECTS = [
      { num: "01", name: "Nextlevel Studio", category: "Client", imgs: {
        col1Top: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1280&q=85",
        col1Bot: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055431_11d841fd-8b41-46a5-82e4-b04f2407a7d8.png&w=1280&q=85",
        col2: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055451_e317bf2d-28d4-48cc-86b0-6f72f25b6327.png&w=1280&q=85",
      }},
      { num: "02", name: "Aura Brand Identity", category: "Personal", imgs: {
        col1Top: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055654_911201c5-36d9-4bc6-bac7-331adfce159f.png&w=1280&q=85",
        col1Bot: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055723_5ceda0b8-d9c2-4665-b2e3-83ba19ba76d1.png&w=1280&q=85",
        col2: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055753_adc5dcbd-a8e6-49c0-b43a-9b030d835cea.png&w=1280&q=85",
      }},
      { num: "03", name: "Solaris Digital", category: "Client", imgs: {
        col1Top: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055759_963cfb0b-4bd1-4b0f-9d0a-09bd6cf95b2f.png&w=1280&q=85",
        col1Bot: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_060108_438f781a-9846-4dcc-89ab-c4e6cb830f5b.png&w=1280&q=85",
        col2: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055818_9d062121-ad7e-46b9-999a-1a6a692ef1ee.png&w=1280&q=85",
      }},
    ];

    const ProjectCard = ({ project, index }) => {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ["start end", "end start"] });
      const totalCards = PROJECTS.length;
      const targetScale = 1 - (totalCards - 1 - index) * 0.03;
      const scale = useTransform(scrollYProgress, [0, 1], [1, targetScale]);
      const opacity = useTransform(scrollYProgress, [0.7, 1], [1, 0.6]);

      return (
        <div ref={ref} className="h-[85vh] sticky" style={{ top: "clamp(6rem, 8vw, 8rem)" }}>
          <motion.div style={{ scale, opacity }} className="w-full h-full rounded-[40px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8 flex flex-col">
            <div className="flex flex-wrap items-start gap-4 md:gap-8 mb-6">
              <div className="font-black leading-none text-[#D7E2EA]" style={{ fontSize: "clamp(3rem, 10vw, 140px)" }}>{project.num}</div>
              <div className="flex flex-col gap-1 flex-1 min-w-[150px]">
                <span className="text-[#D7E2EA]/60 uppercase tracking-widest text-xs">{project.category}</span>
                <h3 className="font-bold uppercase text-[#D7E2EA] leading-none" style={{ fontSize: "clamp(1.2rem, 3vw, 2.5rem)" }}>{project.name}</h3>
              </div>
              <LiveProjectButton />
            </div>
            <div className="flex-1 flex gap-3 sm:gap-4 md:gap-6 min-h-0">
              <div className="w-[40%] flex flex-col gap-3 sm:gap-4 md:gap-6">
                <img src={project.imgs.col1Top} alt="" loading="lazy" className="rounded-[40px] sm:rounded-[50px] md:rounded-[60px] object-cover w-full flex-shrink-0" style={{ height: "clamp(130px, 16vw, 230px)" }} />
                <img src={project.imgs.col1Bot} alt="" loading="lazy" className="rounded-[40px] sm:rounded-[50px] md:rounded-[60px] object-cover w-full flex-1 min-h-0" style={{ minHeight: "clamp(160px, 22vw, 340px)" }} />
              </div>
              <div className="w-[60%]">
                <img src={project.imgs.col2} alt="" loading="lazy" className="rounded-[40px] sm:rounded-[50px] md:rounded-[60px] object-cover w-full h-full" />
              </div>
            </div>
          </motion.div>
        </div>
      );
    };

    const ProjectsSection = () => (
      <section id="projects" className="bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 relative z-10 px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32">
        <FadeIn y={40}>
          <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center mb-16 sm:mb-20 md:mb-28" style={{ fontSize: "clamp(3rem, 12vw, 160px)" }}>Project</h2>
        </FadeIn>
        <div className="max-w-6xl mx-auto">
          {PROJECTS.map((p, i) => <ProjectCard key={p.num} project={p} index={i} />)}
        </div>
      </section>
    );

    /* ============ APP ============ */
