      const rows = []; let i = 0, r = 0;
      while (i < count) {
        const row = new Array(cols).fill(-1);
        const a = (r * 2 + (r % 2)) % cols;
        row[a] = i++;
        if (r % 3 === 0 && i < count) { let b = (a + 2) % cols; if (b === a) b = (a + 1) % cols; row[b] = i++; }
        rows.push(row); r++;
      }
      return rows;

    /* ---------------- HOOKS ---------------- */
    const getBp = () => { const w = window.innerWidth; return w < BP.mobile ? 'mobile' : w < BP.tablet ? 'tablet' : 'desktop'; };
    function useBreakpoint() {
      const [bp, setBp] = useState(getBp);
      useEffect(() => { const u = () => setBp(getBp()); window.addEventListener('resize', u); return () => window.removeEventListener('resize', u); }, []);

    function useIsTouch() {
      const [t, setT] = useState(() => window.matchMedia('(pointer: coarse)').matches);

    /* ---------------- OVERLAY SHELL ---------------- */
    function Overlay({ onClose, bg, fg, children, onBack }) {
      const [entered, setEntered] = useState(false);
      const [leaving, setLeaving] = useState(false);
      useEffect(() => {
        const r = requestAnimationFrame(() => requestAnimationFrame(() => setEntered(true)));
        return () => cancelAnimationFrame(r);
      }, []);
      const close = useCallback(() => {
        if (leaving) return;
        setLeaving(true);
        setTimeout(() => (onBack || onClose)(), 680);
      }, [leaving, onBack, onClose]);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') close(); };

          <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '20px 24px' }}>
            <span style=${{ fontSize: '12px', letterSpacing: '-.02em', textTransform: 'uppercase', opacity: .6 }}>PRMPT — MENU</span>
            <button data-hover class="x-btn" onClick=${close}>✕ CLOSE</button>
          </div>
          <div style=${{ padding: '2vh 24px 4vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', flex: 1 }}>
            ${items.map((it, i) => html`
              <button key=${it[0]} data-hover class="menu-row page-enter" style=${{ animationDelay: (i * 0.06) + 's' }} onClick=${() => onNav(it[3])}>
                <span class="idx">${it[0]}</span>
                <span class="ttl">${it[1]}</span>
                <span class="dsc">${it[2]}</span>
              </button>`)}
          </div>
          <div style=${{ display: 'flex', justifyContent: 'space-between', padding: '20px 24px', fontSize: '11px', letterSpacing: '-.02em', textTransform: 'uppercase', opacity: .5, borderTop: '1px solid rgba(255,255,255,.2)' }}>
            <span>PRMPT (R) 2026</span>
            <span>SS26 — SYNTHETIC ARCHIVE</span>
          </div>
        `}
      </${Overlay}>`;
    }

    /* ---------------- APP ---------------- */
    function App() {
      const bp = useBreakpoint();
      const isTouch = useIsTouch();
      const isDesktop = bp === 'desktop' && !isTouch;
      const cols = bp === 'mobile' ? 2 : bp === 'tablet' ? 3 : 4;

      const [view, setView] = useState(() => hashToView(location.hash));
      const [menuOpen, setMenuOpen] = useState(false);
      const [cart, setCart] = useState([]);

      const spacerRef = useRef(null); const panelRef = useRef(null); const innerRef = useRef(null);
      const leftVidRef = useRef(null); const rightVidRef = useRef(null);
      const infoRef = useRef(null); const buyRef = useRef(null);
      const overlayRef = useRef(null); const footerRef = useRef(null);
      const cursorRef = useRef(null); const cursorInnerRef = useRef(null); const symbolRef = useRef(null);
      const cardsRef = useRef([]);
      const mouseXRef = useRef(window.innerWidth / 2);
      const videosLoadedRef = useRef({ left: false, right: false });
      const lastSymbolRef = useRef(0);

      const layout = buildLayout(GALLERY_IMAGES.length, cols);

      /* routing */
      const navigate = useCallback((v) => {
        setMenuOpen(false);
        location.hash = v === 'home' ? '/' : '/' + v;
        setView(v);
        window.scrollTo(0, 0);
      }, []);
      useEffect(() => {
        const onHash = () => setView(hashToView(location.hash));
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      useEffect(() => { document.title = TITLES[view] || TITLES.home; }, [view]);

      useEffect(() => { document.documentElement.style.overflow = (view !== 'home' || menuOpen) ? 'hidden' : ''; }, [view, menuOpen]);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setMenuOpen(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      /* cart — cart items now are { id, size } */
      const addToCart = useCallback((item) => setCart((c) => [...c, typeof item === 'number' ? { id: item, size: 'M' } : item]), []);
      const removeItem = useCallback((i) => setCart((c) => c.filter((_, j) => j !== i)), []);
      const clearCart = useCallback(() => setCart([]), []);

      /* cursor */
      useEffect(() => {
        if (!isDesktop) return;
        const onMove = (e) => {
          mouseXRef.current = e.clientX;
          if (cursorRef.current) { cursorRef.current.style.left = e.clientX + 'px'; cursorRef.current.style.top = e.clientY + 'px'; }
        };
        const over = (e) => { if (e.target.closest && e.target.closest('[data-hover]')) cursorInnerRef.current && cursorInnerRef.current.classList.add('big'); };
        const out = (e) => { if (e.target.closest && e.target.closest('[data-hover]')) cursorInnerRef.current && cursorInnerRef.current.classList.remove('big'); };
        const down = () => { cursorInnerRef.current && cursorInnerRef.current.classList.add('click'); };
        const up = () => { cursorInnerRef.current && cursorInnerRef.current.classList.remove('click'); };
        window.addEventListener('mousemove', onMove, { passive: true });
        document.addEventListener('mouseover', over);
        document.addEventListener('mouseout', out);
        document.addEventListener('mousedown', down);
        document.addEventListener('mouseup', up);
        document.body.classList.add('cursor-hidden');
        return () => {
          window.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseover', over);
          document.removeEventListener('mouseout', out);
          document.removeEventListener('mousedown', down);
          document.removeEventListener('mouseup', up);
          document.body.classList.remove('cursor-hidden');
        };
      }, [isDesktop]);

      const onVideoLoaded = useCallback((side) => {
        videosLoadedRef.current[side] = true;
        if (videosLoadedRef.current.left && videosLoadedRef.current.right) {
          const c = document.getElementById('main-canvas');
          if (c) c.style.opacity = '1';
        }
      }, []);

      useEffect(() => {
        const t = setTimeout(() => { const c = document.getElementById('main-canvas'); if (c) c.style.opacity = '1'; }, 3000);
        return () => clearTimeout(t);
      }, []);

      /* desktop scrubbing */
      useEffect(() => {
        if (!isDesktop) return;
        let raf = 0;
        const tick = () => {
          const lv = leftVidRef.current, rv = rightVidRef.current;
          const w = window.innerWidth, cx = w / 2, dz = Math.max(30, w * 0.05), x = mouseXRef.current;
          if (x < cx - dz) {
            if (lv) lv.style.visibility = 'hidden';
            if (rv) { rv.style.visibility = 'visible';
              const p = Math.min(1, Math.max(0, ((cx - dz) - x) / (cx - dz)));
              const t = p * (rv.duration || 0);
              if (!rv.seeking && Math.abs(rv.currentTime - t) > 0.02) rv.currentTime = t; }
          } else if (x > cx + dz) {
            if (rv) rv.style.visibility = 'hidden';
            if (lv) { lv.style.visibility = 'visible';
              const s = cx + dz, p = Math.min(1, Math.max(0, (x - s) / (w - s)));
              const t = p * (lv.duration || 0);
              if (!lv.seeking && Math.abs(lv.currentTime - t) > 0.02) lv.currentTime = t; }
          } else {
            if (lv && !lv.seeking && lv.currentTime !== 0) lv.currentTime = 0;
            if (rv && !rv.seeking && rv.currentTime !== 0) rv.currentTime = 0;
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [isDesktop]);

      /* mobile autoplay */
      useEffect(() => {
        if (isDesktop) return;
        const lv = leftVidRef.current, rv = rightVidRef.current;
        if (!lv || !rv) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const show = (side) => {
          if (side === 'left') { lv.style.display = 'block'; rv.style.display = 'none'; lv.currentTime = 0; lv.play().catch(() => {}); }
          else { rv.style.display = 'block'; lv.style.display = 'none'; rv.currentTime = 0; rv.play().catch(() => {}); }
        };
        const onLE = () => show('right'), onRE = () => show('left');
        lv.addEventListener('ended', onLE); rv.addEventListener('ended', onRE);
        show('left');
        return () => { lv.removeEventListener('ended', onLE); rv.removeEventListener('ended', onRE); lv.pause(); rv.pause(); };
      }, [isDesktop]);

      useEffect(() => {
        const onScroll = () => {
          const now = performance.now();
          if (now - lastSymbolRef.current < 80) return;
          lastSymbolRef.current = now;
          if (symbolRef.current) symbolRef.current.textContent = CIRCLE_SYMBOLS[Math.floor(Math.random() * CIRCLE_SYMBOLS.length)];
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const updateSpacer = useCallback(() => {
        const vh = window.innerHeight, inner = innerRef.current, spacer = spacerRef.current;
        if (!inner || !spacer) return;
        const maxScroll = Math.max(0, inner.scrollHeight - vh);
        spacer.style.height = (vh + maxScroll + 2 * vh) + 'px';
      }, []);
      useLayoutEffect(() => {
        updateSpacer(); requestAnimationFrame(updateSpacer);
        window.addEventListener('resize', updateSpacer);
        window.addEventListener('load', updateSpacer);
        return () => { window.removeEventListener('resize', updateSpacer); window.removeEventListener('load', updateSpacer); };
      }, [updateSpacer, cols]);

      useEffect(() => {
        let raf = 0;
        const update = () => {
          const scrollY = window.scrollY, vh = window.innerHeight;
          const inner = innerRef.current;
          const maxScroll = inner ? Math.max(0, inner.scrollHeight - vh) : 0;
          if (panelRef.current) {
            const p1 = Math.min(1, Math.max(0, scrollY / vh));
            panelRef.current.style.transform = 'translateY(' + (vh * (1 - p1)) + 'px)';
          }
          if (inner) {
            const p2 = scrollY > vh ? Math.min(maxScroll, scrollY - vh) : 0;
            inner.style.transform = 'translateY(' + (-p2) + 'px)';
          }
          const canvas = document.getElementById('main-canvas');
          if (canvas) canvas.style.visibility = scrollY > vh ? 'hidden' : 'visible';
          for (let i = 0; i < cardsRef.current.length; i++) {
            const card = cardsRef.current[i];
            if (!card) continue;
            const r = card.getBoundingClientRect();
            if (r.bottom <= 0 || r.top >= vh) { card.style.transform = 'scale(0)'; continue; }
            const enter = Math.min(1, (vh - r.top) / (vh * 0.6));
            const exit = Math.min(1, r.bottom / (vh * 0.4));
            card.style.transform = 'scale(' + Math.max(0, Math.min(enter, exit)) + ')';
          }
          const outroStart = vh + maxScroll, outroDur = Math.max(100, vh - 100);
          if (scrollY > outroStart) {
            const p = Math.min(1, (scrollY - outroStart) / outroDur);
            const off = isDesktop ? 166 : 132;
            if (overlayRef.current) overlayRef.current.style.opacity = String(p);
            if (infoRef.current) { infoRef.current.style.transform = 'translateY(' + (-off * p) + 'px)'; infoRef.current.style.opacity = String(1 - p); }
            if (buyRef.current) buyRef.current.style.transform = 'scale(' + p + ')';
            if (footerRef.current) footerRef.current.style.opacity = String(p);
          } else {
            if (overlayRef.current) overlayRef.current.style.opacity = '0';
            if (infoRef.current) { infoRef.current.style.transform = 'translateY(0)'; infoRef.current.style.opacity = '1'; }
            if (buyRef.current) buyRef.current.style.transform = 'scale(0)';
            if (footerRef.current) footerRef.current.style.opacity = '0';
          }
          raf = requestAnimationFrame(update);
        };
        raf = requestAnimationFrame(update);
        return () => cancelAnimationFrame(raf);
      }, [isDesktop]);

      const logoWidth = bp === 'mobile' ? 124 : bp === 'tablet' ? 266 : 355;
      const logoPos = bp === 'mobile' ? { top: 16, left: 16 } : { top: 32, left: 32 };
      const capLeft = bp === 'mobile' ? 16 : 32;
      const capTop = bp === 'mobile' ? 118 : bp === 'tablet' ? 180 : 244;
      const capWidth = bp === 'mobile' ? 'calc(100vw - 32px)' : bp === 'tablet' ? 'calc(50vw - 48px)' : '692px';
      const navPos = bp === 'mobile' ? { top: 16, right: 16 } : { top: 32, right: 32 };
      const homeUI = view === 'home' && !menuOpen;

      return html`
        <div id="scroll-spacer" ref=${spacerRef}
          style=${{ position: 'relative', userSelect: 'none', background: 'white', height: '500vh' }}>

          ${isDesktop && html`
            <div ref=${cursorRef} style=${{ position: 'fixed', pointerEvents: 'none', zIndex: 100,
              left: '50%', top: '50%', transform: 'translate(-50%, -50%)', mixBlendMode: 'exclusion', willChange: 'left, top' }}>
              <span ref=${cursorInnerRef} class="cursor-inner"><${CursorGlyph} /></span>
            </div>`}

          ${homeUI && html`
            <div class="enter-slide" style=${{ position: 'fixed', pointerEvents: 'none', zIndex: 20,
              top: logoPos.top + 'px', left: logoPos.left + 'px', width: logoWidth + 'px',
              mixBlendMode: 'exclusion', color: '#fff', animationDelay: '0s' }}>
              <${LogoSvg} />
            </div>

            <p class="enter-slide" style=${{ position: 'fixed', pointerEvents: 'none', zIndex: 20, margin: 0,
              left: capLeft + 'px', top: capTop + 'px', width: capWidth, mixBlendMode: 'exclusion',
              fontSize: '12px', lineHeight: '140%', letterSpacing: '-.04em', color: '#fff', animationDelay: '.3s' }}>
              When switching between videos near the center, do not reset currentTime to 0 abruptly. Add a small dead zone: if cursor is within +/-50px of center, keep both videos at currentTime = 0 and show whichever was last active.
            </p>

            <div class="enter-slide" style=${{ position: 'fixed', zIndex: 20, pointerEvents: 'none',
              top: navPos.top + 'px', right: navPos.right + 'px', width: isDesktop ? '330px' : 'auto', height: '30px',
              mixBlendMode: 'exclusion', animationDelay: '.15s' }}>
              <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', height: '100%' }}>
                ${isDesktop && html`
                  <button data-hover class="link-u" onClick=${() => navigate('about')}
                    style=${{ textTransform: 'uppercase', color: '#fff', fontSize: '15px', letterSpacing: '-.02em', pointerEvents: 'auto' }}>ABOUT</button>`}
                <div style=${{ display: 'flex', alignItems: 'center', gap: isDesktop ? '50px' : '20px' }}>
                  <button data-hover onClick=${() => setMenuOpen(true)} style=${{ pointerEvents: 'auto', display: 'block', lineHeight: 0 }}>
                    <${HamburgerIcon} size=${isDesktop ? 30 : 24} />
                  </button>
                  <button data-hover onClick=${() => navigate('cart')} class="link-u"
                    style=${{ color: '#fff', fontSize: isDesktop ? '15px' : '13px', letterSpacing: '-.02em', pointerEvents: 'auto', textTransform: 'uppercase' }}>
                    [ CART${cart.length > 0 ? ' — ' + cart.length : ''} ]
                  </button>
                </div>
              </div>
            </div>

            <div id="outro-info" ref=${infoRef} class="enter-fade" data-outro-offset=${isDesktop ? 166 : 132}
              style=${{ position: 'fixed', pointerEvents: 'none', zIndex: 20, mixBlendMode: 'exclusion',
                display: 'flex', flexDirection: 'column', alignItems: 'center', animationDelay: '.45s',
                ...(isDesktop ? { right: '32px', bottom: '80px', width: '330px' } : { left: 0, right: 0, bottom: '48px' }) }}>
              <div style=${{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', width: isDesktop ? '100%' : '252px', marginBottom: isDesktop ? '32px' : '12px' }}>
                <div style=${{ position: 'relative', width: isDesktop ? '30px' : '20px', height: isDesktop ? '30px' : '20px', marginBottom: '16px' }}>
                  <${CircleIcon} size=${isDesktop ? 30 : 20} sw=${isDesktop ? 2.5 : 2} />
                  <span ref=${symbolRef} style=${{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    textTransform: 'uppercase', color: '#fff', fontSize: isDesktop ? '15px' : '10px', letterSpacing: '-.04em' }}>8</span>
                </div>
                <div style=${{ textTransform: 'uppercase', color: '#fff', textAlign: 'center', width: '100%',
                  fontSize: isDesktop ? '30px' : '20px', lineHeight: '100%', letterSpacing: '-.04em' }}>ARCHIVE COLLECTION<br />"PROMPT"</div>
              </div>
              <div style=${{ color: '#fff', textAlign: 'center', fontSize: isDesktop ? '80px' : '60px', lineHeight: '100%', letterSpacing: '-.04em' }}>$97,33</div>
            </div>

            <div id="outro-buy" ref=${buyRef} style=${{ position: 'fixed', zIndex: 20, pointerEvents: 'none',
              mixBlendMode: 'exclusion', transformOrigin: 'right bottom', transform: 'scale(0)',
              background: '#fff', borderRadius: '1335px', display: 'flex', alignItems: 'center', justifyContent: 'center',
              ...(isDesktop ? { right: '32px', bottom: '32px', width: '330px', height: '174px' } : { left: '16px', right: '16px', bottom: '60px', height: '100px' }) }}>
              <span style=${{ fontSize: isDesktop ? '110px' : '72px', letterSpacing: '-.04em', color: '#fff', mixBlendMode: 'exclusion' }}>view</span>
            </div>

            <div id="outro-overlay" ref=${overlayRef} style=${{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 12, background: '#fff', opacity: 0 }}></div>
          `}

          <div id="main-canvas" style=${{ position: 'fixed', overflow: 'hidden', pointerEvents: 'none', zIndex: 0,
            opacity: 0, transition: 'opacity .3s ease',
            ...(isDesktop ? { inset: 0, width: '100%', height: '100%' } : { left: 0, top: '220px', width: '100vw', height: 'calc(100vh - 220px)' }) }}>
            <video ref=${leftVidRef} src=${LEFT_VIDEO} muted playsInline preload="auto" onLoadedData=${() => onVideoLoaded('left')}
              style=${{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block', visibility: isDesktop ? 'hidden' : 'visible' }} />
            <video ref=${rightVidRef} src=${RIGHT_VIDEO} muted playsInline preload="auto" onLoadedData=${() => onVideoLoaded('right')}
              style=${{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block', visibility: 'visible' }} />
          </div>

          <div ref=${panelRef} style=${{ position: 'fixed', inset: 0, zIndex: 10, background: '#000', transform: 'translateY(100vh)', willChange: 'transform' }}>
            <div ref=${innerRef} style=${{ width: '100%', paddingTop: 'min(400px, 40vh)', willChange: 'transform' }}>
              <div style=${{ display: 'grid', gap: '16px', padding: '0 16px', paddingBottom: '100vh', gridTemplateColumns: 'repeat(' + cols + ', minmax(0, 1fr))' }}>
                ${layout.flat().map((imgIdx, fi) => {
                  if (imgIdx === -1) return html`<div key=${'s' + fi} style=${{ aspectRatio: '2 / 3' }}></div>`;
                  const left = (fi % cols) < cols / 2;
                  return html`<div key=${'c' + imgIdx} class="bp-card" ref=${(el) => { cardsRef.current[imgIdx] = el; }}
                    style=${{ aspectRatio: '2 / 3', transform: 'scale(0)', transformOrigin: left ? 'right bottom' : 'left bottom',
                      backgroundImage: 'url("' + GALLERY_IMAGES[imgIdx] + '")', backgroundSize: 'cover', backgroundPosition: 'center' }}></div>`;
                })}
              </div>
              <div style=${{ display: 'flex', justifyContent: 'center', paddingBottom: '60px', gap: '12px', flexWrap: 'wrap' }}>
                <button data-hover class="pill" onClick=${() => navigate('archive')}
                  style=${{ pointerEvents: 'auto', background: '#fff', color: '#000', fontSize: '14px', padding: '14px 36px', textTransform: 'uppercase' }}>
                  FULL ARCHIVE →
                </button>
                <button data-hover class="pill" onClick=${() => navigate('journal')}
                  style=${{ pointerEvents: 'auto', background: 'transparent', color: '#fff', fontSize: '14px', padding: '14px 36px', textTransform: 'uppercase', border: '1px solid rgba(255,255,255,.3)' }}>
                  READ THE JOURNAL
                </button>
              </div>
            </div>
          </div>

          ${homeUI && html`
            <div id="outro-footer" ref=${footerRef} style=${{ position: 'fixed', pointerEvents: 'none', zIndex: 30,
              left: '16px', right: '16px', bottom: isDesktop ? '32px' : '24px', mixBlendMode: 'exclusion', opacity: 0,
              display: 'flex', gap: isDesktop ? '80px' : '0', justifyContent: isDesktop ? 'flex-start' : 'space-between',
              fontSize: isDesktop ? '13px' : '11px', letterSpacing: '-.02em', textTransform: 'uppercase', color: '#fff' }}>
              <span>PRMPT (R) 2026</span>
              <button data-hover onClick=${() => navigate('privacy')} style=${{ pointerEvents: 'auto', color: '#fff', textTransform: 'uppercase', fontSize: 'inherit', letterSpacing: 'inherit' }}>PRIVACY POLICY</button>
            </div>`}

          ${menuOpen && html`<${MenuOverlay} onNav=${navigate} onClose=${() => setMenuOpen(false)} />`}
          ${view === 'about' && html`<${AboutPage} onBack=${() => navigate('home')} />`}
          ${view === 'archive' && html`<${ArchivePage} onBack=${() => navigate('home')} addToCart=${addToCart} cart=${cart} />`}
          ${view === 'journal' && html`<${JournalPage} onBack=${() => navigate('home')} />`}
          ${view === 'cart' && html`<${CartPage} onBack=${() => navigate('home')} onArchive=${() => navigate('archive')} cart=${cart} removeItem=${removeItem} clearCart=${clearCart} />`}
          ${view === 'shipping' && html`<${ShippingPage} onBack=${() => navigate('home')} />`}
          ${view === 'privacy' && html`<${PrivacyPage} onBack=${() => navigate('home')} />`}
          ${view === 'contact' && html`<${ContactPage} onBack=${() => navigate('home')} />`}
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
