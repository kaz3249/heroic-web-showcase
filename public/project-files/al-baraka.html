    /* Smooth Fade In Animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
    .delay-4 { animation-delay: 0.8s; }

    /* RTL Support */
    [dir="rtl"] {
      font-family: 'Cairo', sans-serif;
    }
    [dir="rtl"] .font-instrument-serif {
      font-family: 'Cairo', sans-serif;

        const onScroll = () => setScrolled(window.scrollY > 50);

      }, []);

      const links = [

        { name: t.nav.expertise, href: '#expertise' },
        { name: t.nav.studio, href: '#studio' },
        { name: t.nav.insights, href: '#insights' },
        { name: t.nav.reachOut, href: '#contact' },
      ];

      const toggleLang = () => {
        const newLang = lang === 'en' ? 'ar' : 'en';
        setLang(newLang);
        document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = newLang;
      };

      return (
        <>
          <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${
            scrolled ? 'bg-brand-dark/90 backdrop-blur-xl border-b border-white/10 py-4' : 'bg-transparent py-6'

                  {t.nav.lang}

                  {/* Content */}
                  <div className="p-6">
                    <h3 className="font-instrument-serif text-2xl text-white mb-3">{service.title}</h3>
                    <p className="text-white/60 font-light leading-relaxed text-sm mb-4">{service.desc}</p>
                    <button className="flex items-center gap-2 text-brand-sand text-sm font-medium group-hover:gap-3 transition-all duration-300">
                      {t.expertise.learnMore} <ArrowRight className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // --- PAGE 3: STUDIO ---
    function StudioPage({ t }) {
      // Verified working images for Studio
      const studioImages = [
        'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=800&q=80',
        'https://images.unsplash.com/photo-1574943320219-553eb213f720?w=600&q=80',
        'https://images.unsplash.com/photo-1530836369250-ef72a3f5cda8?w=600&q=80',
        'https://images.unsplash.com/photo-1585314062643-95233a93a1f5?w=600&q=80'
      ];

      const projects = [
        { ...t.studio.projects[0], img: studioImages[0], span: "md:col-span-2 md:row-span-2" },
        { ...t.studio.projects[1], img: studioImages[1], span: "" },
        { ...t.studio.projects[2], img: studioImages[2], span: "" },
        { ...t.studio.projects[3], img: studioImages[3], span: "md:col-span-2" },
      ];

      return (
        <section id="studio" className="bg-brand-dark py-24 md:py-32">
          <div className="max-w-7xl mx-auto px-6 md:px-12">
            <div className="flex flex-col md:flex-row md:items-end justify-between mb-16">
              <div>
                <span className="text-brand-sand/60 text-sm font-medium tracking-wider uppercase">{t.studio.label}</span>
                <h2 className="mt-4 font-instrument-serif text-white text-4xl md:text-5xl lg:text-6xl leading-[1.1]">
                  {t.studio.title1} <span className="italic text-brand-sand">{t.studio.title2}</span>
                </h2>
              </div>
              <a href="#" className="mt-6 md:mt-0 flex items-center gap-2 text-white text-sm font-medium hover:gap-4 transition-all">
                {t.studio.viewAll} <ArrowRight className="w-4 h-4" />
              </a>
            </div>

            <div className="grid md:grid-cols-3 gap-6 auto-rows-[250px] md:auto-rows-[300px]">
              {projects.map((project, i) => (
                <div key={i} className={`group relative overflow-hidden rounded-2xl cursor-pointer ${project.span}`}>
                  <img 
                    src={project.img} 
                    alt={project.title} 
                    className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105"
                    onError={(e) => {
                      e.target.src = 'https://images.unsplash.com/photo-1500937386664-56d1dfef383f?w=800&q=80';
                    }}
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                  <div className="absolute bottom-0 left-0 right-0 p-6 translate-y-4 group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all duration-500">
                    <h3 className="font-instrument-serif text-white text-2xl md:text-3xl">{project.title}</h3>
                    <p className="text-white/70 text-sm mt-1">{project.location}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // --- PAGE 4: INSIGHTS ---
    function InsightsPage({ t }) {
      // Verified working images for Insights
      const insightImages = [
        'https://images.unsplash.com/photo-1628151016028-7f79444d9c4b?w=600&q=80',
        'https://images.unsplash.com/photo-1586771107445-d3ca888129ff?w=600&q=80',
        'https://images.unsplash.com/photo-1593113598332-cd288d649433?w=600&q=80'
      ];

      const articles = t.insights.articles.map((article, i) => ({
        ...article,
        img: insightImages[i]
      }));

      return (
        <section id="insights" className="bg-brand-dark py-24 md:py-32">
          <div className="max-w-7xl mx-auto px-6 md:px-12">
            <div className="text-center mb-16">
              <span className="text-brand-sand/60 text-sm font-medium tracking-wider uppercase">{t.insights.label}</span>
              <h2 className="mt-4 font-instrument-serif text-white text-4xl md:text-5xl lg:text-6xl">
                {t.insights.title1} <span className="italic text-brand-sand">{t.insights.title2}</span>
              </h2>
            </div>

            <div className="grid md:grid-cols-3 gap-8">
              {articles.map((article, i) => (
                <article key={i} className="group cursor-pointer">
                  <div className="aspect-[4/3] overflow-hidden rounded-2xl mb-6">
                    <img 
                      src={article.img} 
                      alt={article.title} 
                      className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                      onError={(e) => {
                        e.target.src = 'https://images.unsplash.com/photo-1500937386664-56d1dfef383f?w=800&q=80';
                      }}
                    />
                  </div>
                  <div className="flex items-center gap-3 text-xs text-white/50 uppercase tracking-wider mb-3">
                    <span className="text-brand-sand">{article.cat}</span>
                    <span>•</span>
                    <span>{article.date}</span>
                  </div>
                  <h3 className="font-instrument-serif text-white text-2xl leading-tight group-hover:text-brand-sand transition-colors">
                    {article.title}
                  </h3>
                  <div className="mt-4 flex items-center gap-2 text-white text-sm font-medium opacity-0 group-hover:opacity-100 transition-opacity">
                    {t.insights.readArticle} <ArrowRight className="w-4 h-4" />
                  </div>
                </article>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // --- PAGE 5: CONTACT & FOOTER ---
    function ContactPage({ t }) {
      return (
        <section id="contact" className="bg-brand-dark text-white">
          <div className="max-w-7xl mx-auto px-6 md:px-12 py-24 md:py-32">
            <div className="grid md:grid-cols-2 gap-16 md:gap-24">
              <div>
                <span className="text-brand-sand/80 text-sm font-medium tracking-wider uppercase">{t.contact.label}</span>
                <h2 className="mt-4 font-instrument-serif text-white text-4xl md:text-5xl lg:text-6xl leading-[1.1]">
                  {t.contact.title1} <span className="italic text-brand-sand">{t.contact.title2}</span>
                </h2>
                <p className="mt-6 text-white/60 text-base md:text-lg font-light leading-relaxed max-w-md">
                  {t.contact.desc}
                </p>

                <div className="mt-12 space-y-6">
                  <div>
                    <div className="text-white/40 text-xs uppercase tracking-wider mb-1">{t.contact.email}</div>
                    <a href="mailto:hello@albaraka.sd" className="text-lg font-light hover:text-brand-sand transition-colors">hello@albaraka.sd</a>
                  </div>
                  <div>
                    <div className="text-white/40 text-xs uppercase tracking-wider mb-1">{t.contact.phone}</div>
                    <a href="tel:+249123456789" className="text-lg font-light hover:text-brand-sand transition-colors">+249 123 456 789</a>
                  </div>
                  <div>
                    <div className="text-white/40 text-xs uppercase tracking-wider mb-1">{t.contact.location}</div>
                    <p className="text-lg font-light">Khartoum North, Sudan</p>
                  </div>
                </div>
              </div>

              <div>
                <form className="space-y-6">
                  <div className="grid grid-cols-2 gap-6">
                    <div>
                      <label className="text-white/40 text-xs uppercase tracking-wider mb-2 block">{t.contact.form.firstName}</label>
                      <input type="text" className="w-full bg-transparent border-b border-white/20 py-3 text-white font-light focus:border-brand-sand outline-none transition-colors" />
                    </div>
                    <div>
                      <label className="text-white/40 text-xs uppercase tracking-wider mb-2 block">{t.contact.form.lastName}</label>
                      <input type="text" className="w-full bg-transparent border-b border-white/20 py-3 text-white font-light focus:border-brand-sand outline-none transition-colors" />
                    </div>
                  </div>
                  <div>
                    <label className="text-white/40 text-xs uppercase tracking-wider mb-2 block">{t.contact.form.email}</label>
                    <input type="email" className="w-full bg-transparent border-b border-white/20 py-3 text-white font-light focus:border-brand-sand outline-none transition-colors" />
                  </div>
                  <div>
                    <label className="text-white/40 text-xs uppercase tracking-wider mb-2 block">{t.contact.form.message}</label>
                    <textarea rows="4" className="w-full bg-transparent border-b border-white/20 py-3 text-white font-light focus:border-brand-sand outline-none transition-colors resize-none"></textarea>
                  </div>
                  <button type="submit" className="group w-full mt-8 flex items-center justify-center gap-3 bg-white text-brand-dark rounded-full py-4 text-sm font-medium transition-all hover:bg-brand-sand">
                    {t.contact.form.submit}
                    <ArrowRight className="w-4 h-4 transition-transform group-hover:translate-x-1" />
                  </button>
                </form>
              </div>
            </div>
          </div>

          <footer className="border-t border-white/10">
            <div className="max-w-7xl mx-auto px-6 md:px-12 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
              <p className="text-white/40 text-sm">{t.contact.footer.copyright}</p>
              <div className="flex gap-8 text-sm text-white/40">
                <a href="#" className="hover:text-white transition-colors">{t.contact.footer.privacy}</a>
                <a href="#" className="hover:text-white transition-colors">{t.contact.footer.terms}</a>
                <a href="#" className="hover:text-white transition-colors">{t.contact.footer.instagram}</a>
              </div>
            </div>
          </footer>
        </section>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [lang, setLang] = useState('en');
      const t = translations[lang];

      return (
        <div>
          <Navbar lang={lang} setLang={setLang} t={t} />
          <HeroPage t={t} />
          <ExpertisePage t={t} />
          <StudioPage t={t} />
          <InsightsPage t={t} />
          <ContactPage t={t} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
