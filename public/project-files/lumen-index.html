<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LŪMEN // ÍNDEX</title>
    
    <!-- Fonts -->
    <link href="https://db.onlinewebfonts.com/c/ca3d10781128664daddf89bf2e2d1305?family=Graphik+LCG+Regular+Regular" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: {} },
        plugins: [],
      }
    </script>

    <!-- Custom Styles & Animations -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow-x: hidden; }

      .font-graphik { font-family: 'Graphik LCG Regular Regular', 'Graphik LCG', sans-serif; }
      .font-manrope { font-family: 'Manrope', sans-serif; }

      @keyframes fadeUp      { from { opacity: 0; transform: translateY(18px); }  to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn      { from { opacity: 0; }                                to { opacity: 1; } }
      @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes slideInRight{ from { opacity: 0; transform: translateX(20px); }  to { opacity: 1; transform: translateX(0); } }
      @keyframes scaleIn     { from { opacity: 0; transform: scale(0.85); }       to { opacity: 1; transform: scale(1); } }
      @keyframes drawLine    { from { opacity: 0; stroke-dashoffset: 100; }       to { opacity: 1; stroke-dashoffset: 0; } }
      @keyframes gridReveal  { from { opacity: 0; transform: scaleY(0); }         to { opacity: 1; transform: scaleY(1); } }
      @keyframes gridRevealH { from { opacity: 0; transform: scaleX(0); }         to { opacity: 1; transform: scaleX(1); } }

      .anim-fade-up     { opacity: 0; animation: fadeUp       0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-fade-in     { opacity: 0; animation: fadeIn       0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-slide-left  { opacity: 0; animation: slideInLeft  0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-slide-right { opacity: 0; animation: slideInRight 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-scale-in    { opacity: 0; animation: scaleIn      0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-grid-v      { opacity: 0; transform-origin: top;  animation: gridReveal  1.2s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-grid-h      { opacity: 0; transform-origin: left; animation: gridRevealH 1.2s cubic-bezier(0.16,1,0.3,1) forwards; }
      .anim-draw-line   { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawLine 1s cubic-bezier(0.16,1,0.3,1) forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel" data-type="module">
      import React, { useState } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';

      // Inline Lucide-equivalent SVGs for 100% standalone reliability
      const MenuIcon = ({ className, strokeWidth }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      );
      const XIcon = ({ className, strokeWidth }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      );
      const WalletIcon = ({ className, strokeWidth }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
      );

      const NavItem = ({ number, label, delay }) => (
        <div className="flex items-center gap-[3px] anim-fade-up" style={{ animationDelay: delay }}>
          <span className="font-manrope text-[#AFDDFF]/80 text-[13px] leading-[15.6px]">{number}.</span>
          <span className="font-manrope text-white text-[13px] leading-[15.6px] cursor-pointer hover:text-[#AFDDFF] transition-colors">
            {label}
          </span>
        </div>
      );

      const GridLines = () => {
        const verticalPositions = ['12.6%', '37.5%', '61.9%', '86.2%'];
        const horizontalPositions = ['32.7%', '71.4%'];

        return (
          <>
            {verticalPositions.map((left, i) => (
              <div
                key={`v-${i}`}
                className="absolute top-0 h-full w-px bg-white/[0.04] anim-grid-v"
                style={{ left, animationDelay: `${600 + i * 100}ms` }}
              />
            ))}
            {horizontalPositions.map((top, i) => (
              <div
                key={`h-${i}`}
                className="absolute left-0 w-full h-px bg-white/[0.04] anim-grid-h"
                style={{ top, animationDelay: `${800 + i * 150}ms` }}
              />
            ))}
            {horizontalPositions.map((top, hi) =>
              verticalPositions.map((left, vi) => (
                <div
                  key={`plus-${hi}-${vi}`}
                  className="absolute anim-scale-in"
                  style={{ top, left, animationDelay: `${1000 + (hi * 4 + vi) * 80}ms` }}
                >
                  <div className="absolute w-[10px] h-px bg-white/70 -translate-x-1/2 -translate-y-1/2" />
                  <div className="absolute w-px h-[10px] bg-white/70 -translate-x-1/2 -translate-y-1/2" />
                </div>
              ))
            )}
          </>
        );
      };

      const CentralNodes = () => {
        const nodes = [
          {
            id: 1,
            squareStyle: { top: '27%', left: '60%' },
            squareDelay: 1500,
            labelStyle: { top: '11%', left: '26%' },
            labelAnim: 'anim-slide-left',
            labelDelay: 1100,
            title: '[ CORE_ENTITY ]',
            desc: 'Neural node processing real-time data streams.',
            descMaxW: 'max-w-[160px]'
          },
          {
            id: 2,
            squareStyle: { top: '58%', left: '32%' },
            squareDelay: 1800,
            labelStyle: { top: '76%', left: '3%' },
            labelAnim: 'anim-slide-left',
            labelDelay: 1400,
            title: '[ LUMINOUS_INSIGHT ]',
            desc: 'Deep-learning engine synthesizing raw inputs.',
            descMaxW: 'max-w-[160px]'
          },
          {
            id: 3,
            squareStyle: { top: '63%', left: '50%' },
            squareDelay: 2100,
            labelStyle: { top: '50%', left: '78%' },
            labelAnim: 'anim-slide-right',
            labelDelay: 1700,
            title: '[ CONNECTIVITY ]',
            desc: 'Latency-free transmission across distributed networks.',
            descMaxW: 'max-w-[180px]'
          }
        ];

        const connectors = [
          { x1: '38%', y1: '14%', x2: '52%', y2: '14%', delay: 1200 },
          { x1: '52%', y1: '14%', x2: '60%', y2: '27%', delay: 1400 },
          { x1: '32%', y1: '58%', x2: '20%', y2: '74%', delay: 1500 },
          { x1: '20%', y1: '74%', x2: '6%', y2: '74%', delay: 1700 },
          { x1: '78%', y1: '53%', x2: '63%', y2: '53%', delay: 1800 },
          { x1: '63%', y1: '53%', x2: '50%', y2: '63%', delay: 2000 }
        ];

        return (
          <div className="absolute inset-0 pointer-events-none hidden md:block">
            {nodes.map((node) => (
              <div key={node.id}>
                <div
                  className="absolute w-[80px] h-[80px] lg:w-[100px] lg:h-[100px] border border-white/80 anim-scale-in"
                  style={{ ...node.squareStyle, animationDelay: `${node.squareDelay}ms` }}
                />
                <div
                  className={`absolute ${node.labelAnim}`}
                  style={{ ...node.labelStyle, animationDelay: `${node.labelDelay}ms` }}
                >
                  <span className="font-manrope text-white text-[13px] leading-[15.6px] whitespace-nowrap">
                    {node.title}
                  </span>
                  <p className={`font-manrope text-white/50 text-[11px] leading-[14px] mt-[4px] ${node.descMaxW}`}>
                    {node.desc}
                  </p>
                </div>
              </div>
            ))}
            {connectors.map((conn, i) => (
              <svg
                key={`conn-${i}`}
                className="absolute inset-0 w-full h-full pointer-events-none anim-fade-in"
                style={{ animationDelay: `${conn.delay}ms` }}
              >
                <line
                  x1={conn.x1}
                  y1={conn.y1}
                  x2={conn.x2}
                  y2={conn.y2}
                  stroke="rgba(255,255,255,0.25)"
                  strokeWidth="1"
                  vectorEffect="non-scaling-stroke"
                />
              </svg>
            ))}
          </div>
        );
      };

      function App() {
        const [menuOpen, setMenuOpen] = useState(false);

        return (
          <section className="relative w-full h-screen overflow-hidden bg-black">
            <video
              className="absolute inset-0 w-full h-full object-cover anim-fade-in"
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_115057_94c3699b-0fd1-4124-bcf3-3626bb8c1f77.mp4"
              autoPlay
              muted
              loop
              playsInline
            />

            <div className="relative z-10 w-full h-full">
              <nav className="absolute top-0 left-0 w-full flex items-center px-5 md:px-[35px] py-5 md:py-[27px]">
                <div className="flex items-center gap-[40px]">
                  <span className="font-graphik text-white text-[18px] md:text-[21px] leading-[21px] whitespace-nowrap anim-fade-up" style={{ animationDelay: '200ms' }}>
                    LŪMEN // ÍNDEX
                  </span>
                  <div className="hidden lg:flex items-center gap-[40px]">
                    <NavItem number="01" label="ECOSYSTEM" delay="350ms" />
                    <NavItem number="02" label="LIQUIDITY_POOLS" delay="450ms" />
                    <NavItem number="03" label="LUMEN_INDEX" delay="550ms" />
                    <NavItem number="04" label="GOVERNANCE" delay="650ms" />
                  </div>
                </div>

                <div className="hidden lg:flex items-center gap-[12px] ml-auto anim-slide-right" style={{ animationDelay: '600ms' }}>
                  <WalletIcon className="w-[15px] h-[15px] text-white" strokeWidth={1.5} />
                  <span className="font-manrope text-white text-[13px] leading-[15.6px]">0x71...f4e2</span>
                  <span className="font-manrope text-[#AFDDFF] text-[13px] leading-[15.6px]">[ CONNECTED ]</span>
                  <span className="font-manrope text-white text-[13px] leading-[15.6px] ml-[20px]">STATUS:</span>
                  <span className="bg-[#AFDDFF] rounded-[3px] px-[5px] py-[2px] text-black text-[13px] leading-[15.6px]">
                    PRIME_MEMBER
                  </span>
                </div>

                <button
                  className="lg:hidden ml-auto relative w-[40px] h-[40px] flex items-center justify-center anim-fade-in"
                  style={{ animationDelay: '400ms' }}
                  aria-label="Toggle menu"
                  onClick={() => setMenuOpen(!menuOpen)}
                >
                  <span
                    className={`absolute transition-all duration-300 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                      menuOpen ? 'opacity-0 rotate-90 scale-50' : 'opacity-100 rotate-0 scale-100'
                    }`}
                  >
                    <MenuIcon className="w-[22px] h-[22px] text-white" strokeWidth={1.5} />
                  </span>
                  <span
                    className={`absolute transition-all duration-300 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                      menuOpen ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-50'
                    }`}
                  >
                    <XIcon className="w-[22px] h-[22px] text-white" strokeWidth={1.5} />
                  </span>
                </button>
              </nav>

              <div
                className={`fixed inset-0 z-50 lg:hidden transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                  menuOpen ? 'visible' : 'invisible'
                }`}
              >
                <div
                  className={`absolute inset-0 bg-black/90 backdrop-blur-md transition-opacity duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                    menuOpen ? 'opacity-100' : 'opacity-0'
                  }`}
                  onClick={() => setMenuOpen(false)}
                />
                <div
                  className={`relative h-full flex flex-col px-5 pt-24 pb-10 transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                    menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4'
                  }`}
                >
                  <button
                    className="absolute top-5 right-5 w-[40px] h-[40px] flex items-center justify-center"
                    aria-label="Close menu"
                    onClick={() => setMenuOpen(false)}
                  >
                    <XIcon className="w-[22px] h-[22px] text-white" strokeWidth={1.5} />
                  </button>

                  <div className="flex flex-col gap-8">
                    {['ECOSYSTEM', 'LIQUIDITY_POOLS', 'LUMEN_INDEX', 'GOVERNANCE'].map((label, i) => {
                      const num = `0${i + 1}`;
                      return (
                        <div
                          key={label}
                          className={`flex items-center gap-3 transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                            menuOpen ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-6'
                          }`}
                          style={{ transitionDelay: menuOpen ? `${150 + i * 75}ms` : '0ms' }}
                        >
                          <span className="font-manrope text-[#AFDDFF]/80 text-[14px] leading-[1]">{num}.</span>
                          <span className="font-manrope text-white text-[28px] leading-[1.2] tracking-tight">{label}</span>
                        </div>
                      );
                    })}
                  </div>

                  <div
                    className={`mt-auto pt-10 border-t border-white/10 transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${
                      menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'
                    }`}
                    style={{ transitionDelay: menuOpen ? '450ms' : '0ms' }}
                  >
                    <div className="flex items-center gap-[10px] mb-3">
                      <WalletIcon className="w-[15px] h-[15px] text-white" strokeWidth={1.5} />
                      <span className="font-manrope text-white text-[13px] leading-[15.6px]">0x71...f4e2</span>
                      <span className="font-manrope text-[#AFDDFF] text-[13px] leading-[15.6px]">[ CONNECTED ]</span>
                    </div>
                    <div className="flex items-center gap-[8px]">
                      <span className="font-manrope text-white text-[13px] leading-[15.6px]">STATUS:</span>
                      <span className="bg-[#AFDDFF] rounded-[3px] px-[5px] py-[2px] text-black text-[13px] leading-[15.6px]">
                        PRIME_MEMBER
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <h1
                className="font-graphik text-white font-normal leading-[1em] absolute anim-fade-up text-[32px] sm:text-[48px] md:text-[68px] top-[140px] sm:top-[160px] md:top-[178px] left-5 md:left-[35px] max-w-[300px] sm:max-w-[420px] md:max-w-[554px]"
                style={{ animationDelay: '400ms' }}
              >
                Liquid Assets. Luminous Returns.
              </h1>

              <GridLines />
              <CentralNodes />

              <div className="absolute bottom-5 md:bottom-[35px] left-5 md:left-[35px] right-5 md:right-[35px] flex flex-col md:flex-row items-start md:items-end justify-between gap-5 md:gap-0">
                <button
                  className="bg-[#AFDDFF] px-[16px] md:px-[20px] py-[10px] md:py-[12px] flex items-center gap-[10px] hover:bg-[#c8e8ff] transition-colors anim-fade-up"
                  style={{ animationDelay: '900ms' }}
                >
                  <span className="text-black text-[16px] leading-none">&#10022;</span>
                  <span className="font-manrope text-black text-[12px] md:text-[13px] leading-[15.6px] uppercase tracking-wide">
                    Explore Private Banking
                  </span>
                </button>

                <div className="relative max-w-[280px] hidden sm:block anim-slide-right" style={{ animationDelay: '1100ms' }}>
                  <span className="font-manrope text-black text-[13px] leading-[15.6px] bg-[#AFDDFF] px-[6px] py-[2px] inline-block mb-[10px]">
                    NOT A BANK — AN ECOSYSTEM
                  </span>
                  <div className="relative p-[20px]">
                    <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 280 168" preserveAspectRatio="none">
                      <polygon points="0.5,0.5 279.5,0.5 279.5,167.5 30,167.5 0.5,137.5" fill="none" stroke="#AFDDFF" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                    </svg>
                    <p className="relative font-manrope text-white text-[13px] leading-[18px] mb-[18px]">
                      Maps the complexity of modern finance with a partner that brings clarity and organic growth to your portfolio.
                    </p>
                    <span className="relative font-manrope text-[#AFDDFF] text-[13px] leading-[15.6px] cursor-pointer hover:underline">
                      VIEW_TRANSPARENCY_REPORT
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
