      html += '<div class="spec"><b></b><div><small>Supplied in</small><div class="swatches">';
      item.colors.forEach(c => {
        html += '<i style="background:' + c + '"></i>';
      });
      html += "</div></div></div>";
    }
    card.innerHTML = html;
    more.textContent = item.more;
  }

  function setIndex(i, fromScroll) {
    if (!Number.isFinite(i)) return;
    const next = clamp(Math.round(i), 0, STEPS);
    if (next !== index) {
      index = next;
      scenes.forEach((s, si) => s.classList.toggle("is-on", si === index));
      opts.forEach((o, oi) => o.classList.toggle("is-on", oi === index));
      renderCard(index);
      if (innerWidth <= MOBILE_BP) {
        const a = opts[index].getBoundingClientRect();
        const m = menu.getBoundingClientRect();
        menu.scrollBy({ left: (a.left + a.width / 2) - (m.left + m.width / 2), behavior: "smooth" });
      }
      if (!fromScroll) {
        scrollTo({ top: appsStart + (index / STEPS) * appsLen, behavior: "smooth" });
      }
    }
  }

  function paintUI() {
    const y = scrollY || pageYOffset || 0;
    const fadeP = range(y, heroLen, appsStart);
    if (fadeP !== lastFade) {
      lastFade = fadeP;
      heroLayer.style.opacity = 1 - fadeP;
      appsLayer.style.opacity = fadeP;
      heroLayer.style.visibility = fadeP === 1 ? "hidden" : "visible";
      appsLayer.style.visibility = fadeP === 0 ? "hidden" : "visible";
    }
    setIndex(range(y, appsStart, appsStart + appsLen) * STEPS, true);
    const onApps = fadeP > 0.5;
    if (onApps !== lastOnApps) {
      lastOnApps = onApps;
      btnFull.classList.toggle("is-on", !onApps);
      btnOverview.classList.toggle("is-on", onApps);
    }
  }

  function frame() {
    if (ready && dur) {
      const gap = heroTarget * dur - seekAt;
      if (Math.abs(gap) > 0.0008) {
        seekAt += gap * 0.115;
        if (video.readyState >= 2 && !video.seeking) {
          try { video.currentTime = seekAt; } catch (e) {}
        }
      }
    }
    paintUI();
    raf = requestAnimationFrame(frame);
  }

  let started = false, attached = false;

  function setBootProgress(fraction) {
    bootBar.style.transform = "scaleX(" + fraction + ")";
    bootPct.textContent = "LOADING " + Math.round(fraction * 100) + "%";
  }

  function start() {
    if (started) return;
    started = ready = true;
    boot.classList.add("done");
    heroTarget = clamp((scrollY || 0) / heroLen, 0, 1);
    seekAt = heroTarget * dur;
    renderCard(0);
    paintUI();
  }

  function attach(src) {
    if (attached) return;
    attached = true;
    video.addEventListener("loadedmetadata", () => {
      dur = isFinite(video.duration) && video.duration > 0 ? video.duration : 6;
      video.pause();
      heroTarget = clamp((scrollY || 0) / heroLen, 0, 1);
      seekAt = heroTarget * dur;
      try { video.currentTime = seekAt; } catch (e) {}
    });
    video.addEventListener("loadeddata", start);
    video.addEventListener("canplaythrough", start);
    video.addEventListener("error", start);
    video.src = src;
    video.load();
    setTimeout(start, 12000);
  }

  function preload() {
    const ctrl = "AbortController" in window ? new AbortController() : null;
    const bail = setTimeout(() => {
      if (attached) return;
      if (ctrl) ctrl.abort();
      setBootProgress(1);
      attach(VIDEO_URL);
    }, 15000);
    fetch(VIDEO_URL, ctrl ? { signal: ctrl.signal } : undefined)
      .then(res => {
        if (!res.ok || !res.body) throw new Error("bad response");
        const total = parseInt(res.headers.get("content-length") || "0", 10);
        const reader = res.body.getReader();
        const chunks = [];
        let got = 0;
        function pump() {
          return reader.read().then(({ done, value }) => {
            if (done) return;
            chunks.push(value);
            got += value.length;
            setBootProgress(total ? got / total : Math.min(got / 6.5e6, 0.95));
            return pump();
          });
        }
        return pump().then(() => new Blob(chunks, { type: "video/mp4" }));
      })
      .then(blob => {
        clearTimeout(bail);
        setBootProgress(1);
        attach(URL.createObjectURL(blob));
      })
      .catch(() => {
        clearTimeout(bail);
        setBootProgress(1);
        attach(VIDEO_URL);
      });
  }

  function unlock() {
    const p = video.play();
    if (p && p.then) p.then(() => video.pause()).catch(() => {});
    else video.pause();
  }
  ["touchstart", "pointerdown", "wheel", "keydown"].forEach(ev => {
    addEventListener(ev, unlock, { once: true, passive: true });
  });

  function inAppsZone() {
    const y = scrollY || pageYOffset || 0;
    return y >= appsStart - 1 && y <= appsStart + appsLen + 1;
  }

  addEventListener("scroll", () => {
    heroTarget = clamp((scrollY || pageYOffset || 0) / heroLen, 0, 1);
  }, { passive: true });

  addEventListener("resize", () => {
    layout(false);
    heroTarget = clamp((scrollY || pageYOffset || 0) / heroLen, 0, 1);
  });

  addEventListener("orientationchange", () => {
    layout(true);
    heroTarget = clamp((scrollY || pageYOffset || 0) / heroLen, 0, 1);
  });

  addEventListener("wheel", (e) => {
    if (!inAppsZone() || wheelLock) return;
    const down = e.deltaY > 0;
    if ((down && index >= STEPS) || (!down && index <= 0)) return;
    e.preventDefault();
    wheelLock = true;
    setIndex(index + (down ? 1 : -1), false);
    setTimeout(() => { wheelLock = false; }, 620);
  }, { passive: false });

  let startY = 0, startX = 0;
  addEventListener("touchstart", (e) => {
    if (e.touches.length) {
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
    }
  }, { passive: true });

  addEventListener("touchend", (e) => {
    if (!inAppsZone()) return;
    const endY = e.changedTouches[0].clientY;
    const endX = e.changedTouches[0].clientX;
    const dy = startY - endY;
    const dx = Math.abs(startX - endX);
    if (Math.abs(dy) < 40 || dx > 60) return;
    const down = dy > 0;
    if ((down && index >= STEPS) || (!down && index <= 0)) return;
    setIndex(index + (down ? 1 : -1), false);
  }, { passive: true });

  btnFull.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  btnOverview.addEventListener("click", () => scrollTo({ top: appsStart, behavior: "smooth" }));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      cancelAnimationFrame(raf);
    } else {
      raf = requestAnimationFrame(frame);
    }
  });

  video.pause();
  video.muted = true;
  layout(true);
  buildMenu();
  renderCard(0);
  paintUI();
  preload();
  raf = requestAnimationFrame(frame);

})();
</script>
</body>
</html>
