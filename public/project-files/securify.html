    /* ─── AMBIENT PARTICLE FIELD (snow + mist, sits behind everything below hero) ─── */
    const ParticleField = () => {
      const ref = React.useRef(null);

      React.useEffect(() => {
        const canvas = ref.current;
        const ctx = canvas.getContext('2d');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let w = 0, h = 0, dpr = 1, raf = 0;
        let flakes = [], blobs = [];

        const rand = (a, b) => a + Math.random() * (b - a);

        /* bias positions toward the left / right edges, like the video */
        const sideX = () => {
          const r = Math.random();
          if (r < 0.38) return rand(0, w * 0.22);
          if (r < 0.76) return rand(w * 0.78, w);
          return rand(w * 0.22, w * 0.78);
        };

        const makeFlake = (spawnTop) => {
          const centerBand = Math.random() > 0.76;   /* few & faint in the middle */
          const type = Math.random();                /* size class: sharp / soft / chunk */
          return {
            x: centerBand ? rand(w * 0.25, w * 0.75) : sideX(),
            y: spawnTop ? rand(-40, -5) : rand(0, h),
            r: type < 0.6 ? rand(0.6, 1.8) : type < 0.9 ? rand(1.8, 3.2) : rand(3.5, 6.5),
            blur: type >= 0.6,
            vy: rand(0.12, 0.5),
            sway: rand(0, Math.PI * 2),
            swaySpeed: rand(0.002, 0.006),
            swayAmp: rand(0.15, 0.5),
            a: centerBand ? rand(0.05, 0.14) : rand(0.15, 0.5) * (type < 0.6 ? 1 : 0.45),
          };
        };

        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const count = Math.min(150, Math.max(60, Math.floor((w * h) / 14000)));
          flakes = Array.from({ length: count }, () => makeFlake(false));
          blobs = Array.from({ length: 6 }, (_, i) => ({
            x: i % 2 === 0 ? rand(-40, w * 0.16) : rand(w * 0.84, w + 40),
            y: rand(0, h),
            r: rand(160, 380),
            a: rand(0.02, 0.05),
            vy: rand(0.03, 0.09),
            vx: rand(-0.04, 0.04),
          }));
        };

        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          /* soft mist clouds hugging the edges */
          for (const b of blobs) {
            const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
            g.addColorStop(0, 'rgba(255,255,255,' + b.a + ')');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
          }
          /* snow flakes & powder chunks */
          for (const f of flakes) {
            if (f.blur) {
              const rr = f.r * 3;
              const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr);
              g.addColorStop(0, 'rgba(255,255,255,' + f.a + ')');
              g.addColorStop(1, 'rgba(255,255,255,0)');
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(f.x, f.y, rr, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
              ctx.beginPath();
              ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        };

        const tick = () => {
          for (const b of blobs) {
            b.y += b.vy; b.x += b.vx;
            if (b.y - b.r > h) b.y = -b.r;
            if (b.y + b.r < 0) b.y = h + b.r;
          }
          for (let i = 0; i < flakes.length; i++) {
            const f = flakes[i];
            f.sway += f.swaySpeed;
            f.y += f.vy;
            f.x += Math.sin(f.sway) * f.swayAmp * 0.35;
            if (f.y - f.r * 3 > h) flakes[i] = makeFlake(true);
          }
          draw();
          raf = requestAnimationFrame(tick);
        };

        resize();
        if (reduced) { draw(); } else { tick(); }
        const onResize = () => { resize(); if (reduced) draw(); };
        window.addEventListener('resize', onResize);
        return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
      }, []);

      return (
        <canvas
          ref={ref}
          aria-hidden="true"
          className="fixed inset-0 pointer-events-none"
          style={{ zIndex: -1 }}
        />
      );
    };

                <p className={`text-sm font-medium tracking-tight ${p.highlighted ? 'text-black' : 'text-white'}`}>{p.name}</p>
                <div className="mt-4 mb-2 flex items-baseline gap-1">
                  <span className={`text-4xl font-medium tracking-tight ${p.highlighted ? 'text-black' : 'text-white'}`}>{p.price}</span>
                  {p.period && <span className={`text-sm ${p.highlighted ? 'text-black/60' : 'text-white/50'}`}>{p.period}</span>}
                </div>
                <p className={`text-sm mb-8 ${p.highlighted ? 'text-black/60' : 'text-white/50'}`}>{p.desc}</p>
                <ul className="space-y-3 mb-10 flex-1">
                  {p.features.map((f, j) => (
                    <li key={j} className={`text-sm flex items-center gap-2 ${p.highlighted ? 'text-black/80' : 'text-white/60'}`}>
                      <svg className="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                      </svg>
                      {f}
                    </li>
                  ))}
                </ul>
                <button className={`w-full rounded-full px-6 py-3 text-sm font-medium transition-colors ${p.highlighted ? 'bg-black text-white hover:bg-neutral-800' : 'bg-white/10 text-white hover:bg-white/20'}`}>
                  {p.cta}
                </button>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    /* ─── FINAL CTA ─── */
    const FinalCTA = () => (
      <section className="relative py-32 md:py-48 px-6 md:px-10 overflow-hidden">
        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.03)_0%,transparent_70%)]" />
        <div className="relative max-w-3xl mx-auto text-center">
          <h2 className="section-title text-4xl md:text-6xl lg:text-7xl font-medium text-white tracking-tight">
            your data deserves better
          </h2>
          <p className="mt-6 text-white/60 text-base md:text-lg max-w-md mx-auto leading-relaxed">
            join 65,000+ teams who stopped worrying about breaches. set up in minutes, protected forever.
          </p>
          <div className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
            <button className="bg-white text-black text-sm font-medium rounded-full px-8 py-4 hover:bg-neutral-200 transition-colors w-full sm:w-auto">
              start protecting — it's free
            </button>
            <button className="bg-white/10 text-white text-sm font-medium rounded-full px-8 py-4 hover:bg-white/20 transition-colors w-full sm:w-auto">
              book a demo

          </div>
          <p className="mt-6 text-xs text-white/30">no credit card required · free tier forever · cancel anytime</p>

    /* ─── FOOTER ─── */

        <div className="max-w-6xl mx-auto">
          <div className="grid grid-cols-2 md:grid-cols-5 gap-10 mb-16">
            <div className="col-span-2 md:col-span-1">
              <div className="flex items-center gap-2 mb-4">
                <LogoSVG className="h-4 w-4" />
                <span className="text-white text-sm font-medium tracking-tight">securify</span>
              </div>
              <p className="text-white/40 text-xs leading-relaxed">data security for teams that move fast.</p>
            </div>
            {[
              { title: "product", links: ["features", "pricing", "integrations", "changelog", "docs"] },
              { title: "company", links: ["about", "blog", "careers", "press", "contact"] },
              { title: "resources", links: ["community", "guides", "api reference", "status", "trust center"] },
              { title: "legal", links: ["privacy", "terms", "security", "gdpr", "cookies"] },
            ].map((col, i) => (
              <div key={i}>
                <p className="text-white text-xs font-medium uppercase tracking-wider mb-4">{col.title}</p>
                <ul className="space-y-3">
                  {col.links.map((link, j) => (
                    <li key={j}>
                      <a href="#" className="text-white/40 hover:text-white text-sm transition-colors">{link}</a>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
          <div className="border-t border-white/5 pt-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <p className="text-white/30 text-xs">© 2026 securify, inc. all rights reserved.</p>
            <div className="flex items-center gap-6">
              {["twitter", "github", "linkedin", "discord"].map((s) => (

    /* ─── APP ─── */

      <React.Fragment>
        <ParticleField />
        <Hero />
