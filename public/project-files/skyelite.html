<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyElite - Premium Private Jets</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const App = () => {
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const navItems = ['Start', 'Story', 'Rates', 'Benefits', 'FAQ'];

        return (
          <div className="min-h-screen bg-gray-50">
            <section className="relative h-screen overflow-hidden">
              {/* Video Background */}
              <video
                autoPlay
                muted
                loop
                playsInline
                className="absolute inset-0 w-full h-full object-cover"
                src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4"
              />

              {/* Subtle overlay */}
              <div className="absolute inset-0 bg-gradient-to-b from-white/10 via-white/5 to-white/20 pointer-events-none" />

              {/* Content Wrapper */}
              <div className="relative h-full flex flex-col z-10">
                {/* Navigation Bar */}
                <nav className="w-full max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">
                  <a href="#" className="text-2xl font-semibold text-gray-900 tracking-tight">
                    SkyElite
                  </a>

                  <ul className="hidden md:flex items-center gap-8">
                    {navItems.map((item) => (
                      <li key={item}>
                        <a
                          href="#"
                          className="text-gray-900 hover:text-gray-700 transition-colors font-medium"
                        >
                          {item}
                        </a>
                      </li>
                    ))}
                  </ul>

                  <button
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="md:hidden text-gray-900 hover:text-gray-700 transition-colors"
                    aria-label="Toggle menu"
                  >
                    {mobileMenuOpen ? (
                      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    ) : (
                      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                    )}
                  </button>
                </nav>

                {/* Mobile Menu Dropdown */}
                {mobileMenuOpen && (
                  <div className="md:hidden absolute top-24 left-4 right-4 bg-white/95 backdrop-blur-md rounded-2xl shadow-lg z-50 border border-white/50">
                    <ul className="flex flex-col py-2">
                      {navItems.map((item) => (
                        <li key={item}>
                          <a
                            href="#"
                            onClick={() => setMobileMenuOpen(false)}
                            className="block px-6 py-3 text-gray-900 hover:text-gray-700 hover:bg-gray-100/60 transition-colors font-medium"
                          >
                            {item}
                          </a>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {/* Hero Content */}
                <main className="flex-1 flex items-center justify-center -mt-80 px-8">
                  <div className="max-w-4xl text-center">
                    <p className="text-sm font-semibold text-gray-600 tracking-wider mb-4 uppercase">
                      Private Jets
                    </p>

                    <h1 className="leading-none tracking-tighter">
                      <span className="block text-6xl md:text-7xl lg:text-8xl font-normal text-gray-500">
                        Premium.
                      </span>
                      <span
                        className="block text-6xl md:text-7xl lg:text-8xl font-normal"
                        style={{ color: '#202A36', marginTop: '-12px' }}
                      >
                        Accessible.
                      </span>
                    </h1>

                    <p className="text-lg md:text-xl text-gray-600 mb-6 max-w-2xl mx-auto mt-6">
                      Your dedication deserves recognition.
                    </p>

                    <div className="flex items-center justify-center gap-4 mt-8">
                      <button className="px-4 py-2 rounded-full bg-gray-300 text-gray-800 font-medium hover:bg-gray-400 transition-colors">
                        Discover
                      </button>
                      <button
                        className="px-4 py-2 rounded-full text-white font-medium transition-colors hover:opacity-95"
                        style={{ backgroundColor: '#202A36' }}
                        onMouseEnter={(e) => (e.currentTarget.style.backgroundColor = '#1a2229')}
                        onMouseLeave={(e) => (e.currentTarget.style.backgroundColor = '#202A36')}
                      >
                        Book Now
                      </button>
                    </div>
                  </div>
                </main>
              </div>
            </section>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
